name: Build & Distribute APK

on:
  push:
    branches:
      - main

jobs:
  build-distribute:
    name: Build and Distribute APK to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: "1:260301549772:android:7b1761010955ae046e5269"
          token: "1//0gcCDcEHbTOEtCgYIARAAGBASNwF-L9IrwcuFdfRoDBIPa8rKvDUtBjoQ8LjqA9ENKvJnDqaJO-e2CzuCfsvsPG0yDLzPmy383cc"
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
